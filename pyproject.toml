[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "finding-similar-items"
version = "1.0.0"
description = "Shingling, MinHash, and LSH for near-duplicate news detection"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
similar-items = "finding_similar_items.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

